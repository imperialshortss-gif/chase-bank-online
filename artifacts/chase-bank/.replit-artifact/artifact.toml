kind = "web"
previewPath = "/"
title = "Chase Bank Online Banking"
version = "1.0.0"
id = "artifacts/chase-bank"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19526

[services.development]
run = "pnpm --filter @workspace/chase-bank run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chase-bank", "run", "build" ]
serve = "static"
publicDir = "artifacts/chase-bank/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19526"
BASE_PATH = "/"
